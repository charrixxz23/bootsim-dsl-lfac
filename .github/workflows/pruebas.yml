name: pruebas

# ejecuta las pruebas automatizadas de bootsim dsl en linux y windows.
# no ejecuta las pruebas de mutaciones ni las comparaciones largas con los borradores de f03 (tardan varios minutos); se corren a mano.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: ${{ matrix.os }} con python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - name: bajar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: instalar python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: instalar dependencias (ply 3.11)
        run: python -m pip install -r codigo/requirements.txt

      - name: lexer
        run: python codigo/probar_lexer.py

      - name: parser
        run: python codigo/probar_parser.py

      - name: semantica
        run: python codigo/probar_semantica.py

      - name: simulador y terminal
        run: python codigo/probar_simulador.py

      - name: los diez programas de prueba
        run: python codigo/probar_programas.py
